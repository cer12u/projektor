  product-service-boundary:
    name: Product service entry and mock-provider contracts
    needs: source-integrity
    if: ${{ needs.source-integrity.outputs.integration == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install locked integration runtime
        working-directory: experiments/atomic-command-poc
        run: npm ci
      - name: Integration - actual MCP entry Store policy receipt and client anomalies
        if: ${{ needs.source-integrity.outputs.auth != 'true' && needs.source-integrity.outputs.focused != 'true' }}
        working-directory: experiments/atomic-command-poc
        run: |
          mkdir -p evidence/combined
          set -o pipefail
          node --test --test-reporter=tap service-test/combined-policy-mcp.integration.test.mjs 2>&1 | tee evidence/combined/entry-policy-mcp.tap
      - name: Integration - affected existing machine REST and policy path
        if: ${{ needs.source-integrity.outputs.auth != 'true' && !cancelled() && needs.source-integrity.outputs.focused != 'true' }}
        working-directory: experiments/atomic-command-poc
        run: |
          mkdir -p evidence/combined
          set -o pipefail
          node --test --test-reporter=tap --test-name-pattern='machine: authenticated REST' service-test/resource-policy.test.mjs 2>&1 | tee evidence/combined/existing-policy-mcp.tap
          # A name-filter miss must not become a file-only green result.
          awk '/^[[:space:]]*ok [0-9]+ - machine: authenticated REST/ && !/# SKIP/ {found++} END {exit found != 1}' evidence/combined/existing-policy-mcp.tap
      - name: Integration - scoped Wiki lifecycle authorization and existing restore
        if: ${{ needs.source-integrity.outputs.auth != 'true' && !cancelled() && needs.source-integrity.outputs.focused != 'true' }}
        working-directory: experiments/atomic-command-poc
        run: |
          mkdir -p evidence/combined
          set -o pipefail
          node --test --test-reporter=tap service-test/wiki-lifecycle-authority.test.mjs 2>&1 | tee evidence/combined/wiki-lifecycle-authority.tap
          grep -Eq '^# tests 6$' evidence/combined/wiki-lifecycle-authority.tap
          grep -Eq '^# pass 6$' evidence/combined/wiki-lifecycle-authority.tap
          node --test --test-reporter=tap --test-name-pattern='rename/move/trash|actual existing Wiki key|existing Wiki trash key' service-test/wiki-native.test.mjs session-ports/wiki-create.test.mjs 2>&1 | tee evidence/combined/wiki-lifecycle-restore.tap
          grep -Eq '^# tests 3$' evidence/combined/wiki-lifecycle-restore.tap
          grep -Eq '^# pass 3$' evidence/combined/wiki-lifecycle-restore.tap
      - name: Integration - imported Issue query edit transition and receipt boundaries
        if: ${{ needs.source-integrity.outputs.auth != 'true' && !cancelled() && needs.source-integrity.outputs.repair != 'true' }}
        working-directory: experiments/atomic-command-poc
        run: |
          mkdir -p evidence/combined
          set -o pipefail
          node --test --test-reporter=tap test/issue-compat.integration.test.mjs 2>&1 | tee evidence/combined/issue-compat.tap
          grep -Eq '^# tests 9$' evidence/combined/issue-compat.tap
          grep -Eq '^# pass 9$' evidence/combined/issue-compat.tap
      - name: Integration - actual imported Issue protected human controller
        if: ${{ needs.source-integrity.outputs.auth != 'true' && !cancelled() }}
        working-directory: experiments/product-ui
        run: |
          mkdir -p ../atomic-command-poc/evidence/combined
          set -o pipefail
          node --test --test-reporter=tap test/issue-compatibility-boundary.test.mjs 2>&1 | tee ../atomic-command-poc/evidence/combined/issue-controller.tap
          grep -Eq '^# tests 2$' ../atomic-command-poc/evidence/combined/issue-controller.tap
          grep -Eq '^# pass 2$' ../atomic-command-poc/evidence/combined/issue-controller.tap
      - name: Contract - selected compatibility and protected no-op regressions
        if: ${{ needs.source-integrity.outputs.auth != 'true' && !cancelled() && needs.source-integrity.outputs.repair != 'true' }}
        working-directory: experiments/product-ui
        run: |
          set -o pipefail
          node --test --test-reporter=tap --test-name-pattern='imported same-category|dirty pre-import|false no-op|genuine no-op|only the compact compatibility' test/human-view-port.test.mjs test/i2-my-issues.test.mjs 2>&1 | tee ../atomic-command-poc/evidence/combined/issue-selected-contracts.tap
          grep -Eq '^# tests 6$' ../atomic-command-poc/evidence/combined/issue-selected-contracts.tap
          grep -Eq '^# pass 6$' ../atomic-command-poc/evidence/combined/issue-selected-contracts.tap
      - name: Contract - scoped browser reporter preserves failures and exact case counts
        if: ${{ needs.source-integrity.outputs.auth != 'true' && !cancelled() && needs.source-integrity.outputs.repair != 'true' }}
        working-directory: experiments/product-ui
        run: |
          set -o pipefail
          node --test --test-reporter=tap --test-name-pattern='explicit C22/C23 reporter selection|Issue compatibility C22 and C23|custom reporter never forwards|real Node reporter|reporter final summary' test/reporting.test.mjs 2>&1 | tee ../atomic-command-poc/evidence/combined/issue-reporter.tap
          grep -Eq '^# tests 5$' ../atomic-command-poc/evidence/combined/issue-reporter.tap
          grep -Eq '^# pass 5$' ../atomic-command-poc/evidence/combined/issue-reporter.tap
      - name: Integration - old HTTP entry D1 bearer Store and shared admission boundary
        if: ${{ !cancelled() && needs.source-integrity.outputs.auth == 'true' }}
        working-directory: experiments/atomic-command-poc
        run: |
          mkdir -p evidence/combined
          set -o pipefail
          node --test --test-reporter=tap service-test/legacy-mcp-ingress.integration.test.mjs 2>&1 | tee evidence/combined/legacy-mcp-ingress.tap
          grep -Eq '^# tests 11$' evidence/combined/legacy-mcp-ingress.tap
          grep -Eq '^# pass 11$' evidence/combined/legacy-mcp-ingress.tap
      - name: Contract - existing native MCP shared-rate and missing-policy behavior
        if: ${{ !cancelled() && needs.source-integrity.outputs.auth == 'true' }}
        working-directory: experiments/atomic-command-poc
        run: |
          mkdir -p evidence/combined
          set -o pipefail
          node --test --test-reporter=tap --test-name-pattern='stateless and legacy tool calls share a bounded token bucket|without an explicit invocation policy' service-test/mcp-protocol.test.mjs 2>&1 | tee evidence/combined/native-mcp-rate.tap
          grep -Eq '^# tests 2$' evidence/combined/native-mcp-rate.tap
          grep -Eq '^# pass 2$' evidence/combined/native-mcp-rate.tap
      - name: Verify integration leaves tracked source unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code
      - name: Upload selected integration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: actual-entry-policy-mcp-${{ github.event.pull_request.head.sha }}
          path: experiments/atomic-command-poc/evidence/combined/
          if-no-files-found: warn
          retention-days: 7

  browser-draft-recovery:
    name: Local Chromium encrypted draft recovery
    needs: source-integrity
    if: ${{ needs.source-integrity.outputs.browser == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install locked browser integration runtime
        id: runtime
        working-directory: experiments/atomic-command-poc
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium
      - name: Integration - legacy fixture auth and exact module allowlist failures
        if: ${{ needs.source-integrity.outputs.app_auth != 'true' && needs.source-integrity.outputs.legacy != 'true' && needs.source-integrity.outputs.focused != 'true' }}
        working-directory: experiments/atomic-command-poc
        run: |
          mkdir -p evidence/browser
          set -o pipefail
          node --test --test-reporter=tap browser-test/fixture-authz.test.mjs 2>&1 | tee evidence/browser/fixture-authz.tap
      - name: Install locked product UI integration dependencies
        id: ui
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        working-directory: experiments/product-ui
        run: npm ci --ignore-scripts
      - name: Integration - selected real Chromium product boundary scenarios
        if: ${{ !cancelled() && steps.ui.outcome == 'success' && needs.source-integrity.outputs.app_auth != 'true' }}
        timeout-minutes: 5
        working-directory: experiments/product-ui
        env:
          PROJEKTOR_CORE_SOURCE: ../atomic-command-poc
          FOCUSED_ISSUE_COMPAT: ${{ needs.source-integrity.outputs.focused }}
          LEGACY_URL_CONTINUITY: ${{ needs.source-integrity.outputs.legacy }}
        run: |
          mkdir -p ../atomic-command-poc/evidence/browser
          set -o pipefail
          # This entry builds its fixture. Unchanged unit/typecheck/build evidence is reused.
          if [ "$LEGACY_URL_CONTINUITY" = true ]; then
            PROJEKTOR_UI_E2E_CASES=C24,C25,C26,C27 node --test --test-timeout=90000 --test-reporter=./e2e/github-reporter.mjs e2e/legacy-navigation.test.mjs 2>&1 | tee ../atomic-command-poc/evidence/browser/product-ui-e2e.log
            grep -Eq 'UI E2E summary passed=4 failed=0 incomplete=0 runner_failed=false failed_ids=none$' ../atomic-command-poc/evidence/browser/product-ui-e2e.log
            for case_id in C24 C25 C26 C27; do
              grep -Eq "UI E2E $case_id scenario_body pass$" ../atomic-command-poc/evidence/browser/product-ui-e2e.log
            done
          elif [ "$FOCUSED_ISSUE_COMPAT" = true ]; then
            PROJEKTOR_UI_E2E_CASES=C22,C23 node --test --test-timeout=90000 --test-reporter=./e2e/github-reporter.mjs e2e/issue-compatibility.test.mjs 2>&1 | tee ../atomic-command-poc/evidence/browser/product-ui-e2e.log
            grep -Eq 'UI E2E summary passed=2 failed=0 incomplete=0 runner_failed=false failed_ids=none$' ../atomic-command-poc/evidence/browser/product-ui-e2e.log
            grep -Eq 'UI E2E C22 scenario_body pass$' ../atomic-command-poc/evidence/browser/product-ui-e2e.log
            grep -Eq 'UI E2E C23 scenario_body pass$' ../atomic-command-poc/evidence/browser/product-ui-e2e.log
          else
            node --test --test-timeout=90000 --test-reporter=./e2e/github-reporter.mjs e2e/product.test.mjs e2e/issue-compatibility.test.mjs e2e/legacy-navigation.test.mjs 2>&1 | tee ../atomic-command-poc/evidence/browser/product-ui-e2e.log
            grep -Eq 'UI E2E summary passed=27 failed=0 incomplete=0 runner_failed=false failed_ids=none$' ../atomic-command-poc/evidence/browser/product-ui-e2e.log
          fi
      - name: Integration - app-owned authentication three Chromium cases
        if: ${{ !cancelled() && steps.ui.outcome == 'success' && (needs.source-integrity.outputs.app_auth == 'true' || (needs.source-integrity.outputs.legacy != 'true' && needs.source-integrity.outputs.focused != 'true')) }}
        timeout-minutes: 10
        working-directory: experiments/product-ui
        env:
          PROJEKTOR_CORE_SOURCE: ../atomic-command-poc
          PROJEKTOR_AUTH_CASES: human
        run: |
          mkdir -p ../atomic-command-poc/evidence/browser
          set -o pipefail
          # Builds the actual product UI; real Chromium uses synthetic HTTPS
          # through the final workerd entry and Store, with no external login.
          node --test --test-timeout=180000 --test-reporter=./e2e/auth-diagnostics.mjs e2e/app-auth.test.mjs 2>&1 | tee ../atomic-command-poc/evidence/browser/app-auth.tap
          grep -Eq '^# tests 3$' ../atomic-command-poc/evidence/browser/app-auth.tap
          grep -Eq '^# pass 3$' ../atomic-command-poc/evidence/browser/app-auth.tap
          for field in fail cancelled skipped todo incomplete; do
            grep -Eq "^# $field 0$" ../atomic-command-poc/evidence/browser/app-auth.tap
          done
          grep -Eq "^# runner_failed false$" ../atomic-command-poc/evidence/browser/app-auth.tap
      - name: Integration - owner device approval and revocation Chromium case
        if: ${{ needs.source-integrity.outputs.app_auth_owner_reuse != 'true' && !cancelled() && steps.ui.outcome == 'success' && (needs.source-integrity.outputs.app_auth == 'true' || (needs.source-integrity.outputs.legacy != 'true' && needs.source-integrity.outputs.focused != 'true')) }}
        timeout-minutes: 5
        working-directory: experiments/product-ui
        env:
          PROJEKTOR_CORE_SOURCE: ../atomic-command-poc
        run: |
          mkdir -p ../atomic-command-poc/evidence/browser
          set -o pipefail
          node --test --test-timeout=180000 --test-reporter=tap e2e/native-device.test.mjs 2>&1 | tee ../atomic-command-poc/evidence/browser/native-device.tap
          grep -Eq '^# tests 1$' ../atomic-command-poc/evidence/browser/native-device.tap
          grep -Eq '^# pass 1$' ../atomic-command-poc/evidence/browser/native-device.tap
          for field in fail cancelled skipped todo; do
            grep -Eq "^# $field 0$" ../atomic-command-poc/evidence/browser/native-device.tap
          done
      - name: Verify browser integration leaves tracked source unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code
      - name: Upload browser integration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: affected-browser-integration-${{ github.event.pull_request.head.sha }}
          path: experiments/atomic-command-poc/evidence/browser/
          if-no-files-found: warn
          retention-days: 7
