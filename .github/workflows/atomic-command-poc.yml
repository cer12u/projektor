name: Atomic command PoC

on:
  pull_request:
    paths:
      - 'experiments/atomic-command-poc/**'
      - 'experiments/product-ui/**'
      - 'browser-review-evidence/*.mjs'
      - 'query-review-evidence/*.mjs'
      - 'service-review-evidence/*.mjs'
      - '.github/workflows/atomic-command-poc.yml'

permissions:
  contents: read

# Keep local runtime metadata synthetic; do not fetch Cloudflare cf.json.
env:
  CLOUDFLARE_CF_FETCH_ENABLED: 'false'

concurrency:
  group: atomic-command-poc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sqlite-contract:
    name: SQLite atomic command contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Verify runtime and source
        run: |
          node --version
          git rev-parse HEAD
      - name: Test real SQLite with independent worker connections
        working-directory: experiments/atomic-command-poc
        run: node --test test/*.test.mjs
      - name: Verify tests leave tracked files unchanged
        run: git diff --exit-code

  workerd-contract:
    name: workerd SQLite DO atomic command contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install locked local test runtime
        working-directory: experiments/atomic-command-poc
        run: npm ci
      - name: Test actual workerd SQLite (no deployment)
        working-directory: experiments/atomic-command-poc
        run: |
          node --version
          node_modules/.bin/workerd --version
          git rev-parse HEAD
          npm run test:workerd
      - name: Verify tests leave tracked files unchanged
        run: git diff --exit-code

  authenticated-transport:
    name: Local authenticated HTTP and recovery contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install locked local test runtime
        working-directory: experiments/atomic-command-poc
        run: npm ci
      - name: Test local issuer HTTP authentication and recovery (no deployment)
        working-directory: experiments/atomic-command-poc
        run: |
          node --version
          node_modules/.bin/workerd --version
          git rev-parse HEAD
          npm run test:transport
          npm run test:client
      - name: Verify tests leave tracked files unchanged
        run: git diff --exit-code

  browser-draft-recovery:
    name: Local Chromium encrypted draft recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install locked local browser test runtime
        working-directory: experiments/atomic-command-poc
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium
      - name: Test synthetic authorization fixture
        working-directory: experiments/atomic-command-poc
        run: |
          mkdir -p evidence/browser
          set -o pipefail
          node --test --test-reporter=tap browser-test/fixture-authz.test.mjs 2>&1 | tee evidence/browser/fixture-authz.tap
      - name: Test real Chromium draft recovery (local issuer only)
        working-directory: experiments/atomic-command-poc
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee evidence/browser/browser-suite.log
      - name: Install locked product UI dependencies
        working-directory: experiments/product-ui
        run: npm ci --ignore-scripts
      - name: Build and verify reviewed product UI
        working-directory: experiments/product-ui
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee ../atomic-command-poc/evidence/browser/product-ui-verify.log
      - name: Test seventeen real Chromium product UI scenarios
        timeout-minutes: 5
        working-directory: experiments/product-ui
        env:
          PROJEKTOR_CORE_SOURCE: ../atomic-command-poc
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee ../atomic-command-poc/evidence/browser/product-ui-e2e.log
      - name: Independently probe browser vault isolation
        if: ${{ !cancelled() }}
        run: |
          mkdir -p experiments/atomic-command-poc/evidence/browser
          set -o pipefail
          node browser-review-evidence/vault-probes.mjs 2>&1 | tee experiments/atomic-command-poc/evidence/browser/vault-probes.log
      - name: Independently probe browser editor recovery
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          node --test --test-reporter=tap browser-review-evidence/editor-probes.mjs 2>&1 | tee experiments/atomic-command-poc/evidence/browser/editor-probes.tap
      - name: Independently probe My Issues browser authorization and lifecycle
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          node --test --test-reporter=tap query-review-evidence/browser-probes.mjs 2>&1 | tee experiments/atomic-command-poc/evidence/browser/my-issues-probes.tap
      - name: Verify tests leave tracked files unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code
      - name: Upload synthetic browser screenshots and test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: local-browser-draft-recovery-${{ github.event.pull_request.head.sha }}
          path: experiments/atomic-command-poc/evidence/browser/
          if-no-files-found: warn
          retention-days: 7

  my-issues-query:
    name: My Issues independent query and controller contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install locked local test runtime
        working-directory: experiments/atomic-command-poc
        run: npm ci
      - name: Independently probe Node SQLite query authorization and pagination
        run: |
          mkdir -p experiments/atomic-command-poc/evidence/query
          set -o pipefail
          node --test --test-reporter=tap query-review-evidence/query-probes.mjs 2>&1 | tee experiments/atomic-command-poc/evidence/query/node-probes.tap
      - name: Independently probe actual workerd SQLite query
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          REVIEW_RUNTIME=workerd node --test --test-reporter=tap query-review-evidence/query-probes.mjs 2>&1 | tee experiments/atomic-command-poc/evidence/query/workerd-probes.tap
      - name: Independently probe My Issues controller lifecycle
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          node --test --test-reporter=tap query-review-evidence/controller-probes.mjs 2>&1 | tee experiments/atomic-command-poc/evidence/query/controller-probes.tap
      - name: Verify tests leave tracked files unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code
      - name: Upload synthetic query test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: local-my-issues-query-${{ github.event.pull_request.head.sha }}
          path: experiments/atomic-command-poc/evidence/query/
          if-no-files-found: warn
          retention-days: 7

  product-service-boundary:
    name: Product service entry and mock-provider contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install locked local test runtime
        working-directory: experiments/atomic-command-poc
        run: npm ci
      - name: Test product entry on actual workerd with mocked provider
        working-directory: experiments/atomic-command-poc
        run: |
          mkdir -p evidence/service
          set -o pipefail
          npm run test:service 2>&1 | tee evidence/service/service-suite.log
      - name: Test isolated bootstrap session and draft key ports
        working-directory: experiments/atomic-command-poc
        run: |
          set -o pipefail
          node --test session-ports/*.test.mjs 2>&1 | tee evidence/service/session-ports.log
      - name: Independently probe provider validation and actual product runtime
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          node --test --test-reporter=tap service-review-evidence/provider-probes.mjs service-review-evidence/runtime-probes.mjs 2>&1 | tee experiments/atomic-command-poc/evidence/service/independent-probes.tap
      - name: Verify tests leave tracked files unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code
      - name: Upload synthetic product-service test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: local-product-service-${{ github.event.pull_request.head.sha }}
          path: experiments/atomic-command-poc/evidence/service/
          if-no-files-found: warn
          retention-days: 7

