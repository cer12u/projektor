          git diff --check
          (cd experiments/product-ui && sha256sum -c SOURCE-SHA256SUMS)
      - name: Parse and link the exact reviewed runtime graph (no evaluation)
        working-directory: experiments/atomic-command-poc
        env:
          REVIEWED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node --experimental-vm-modules --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {validateArtifact} from './release/preflight.mjs';
          const review=JSON.parse(await readFile('release/reviewed-product.json','utf8'));
          const result=await validateArtifact(process.cwd(),review);
          console.log(JSON.stringify({head:process.env.REVIEWED_HEAD,result,deploymentAuthorized:false}));
