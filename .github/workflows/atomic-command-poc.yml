name: Atomic command PoC

on:
  pull_request:
    paths:
      - 'experiments/atomic-command-poc/**'
      - 'experiments/product-ui/**'
      - 'browser-review-evidence/*.mjs'
      - 'query-review-evidence/*.mjs'
      - 'service-review-evidence/*.mjs'
      - '.github/workflows/atomic-command-poc.yml'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_CF_FETCH_ENABLED: 'false'

concurrency:
  group: atomic-command-poc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-integrity:
    name: Reviewed source integrity (static)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      integration: ${{ steps.impact.outputs.integration }}
      browser: ${{ steps.impact.outputs.browser }}
      focused: ${{ steps.impact.outputs.focused }}
      repair: ${{ steps.impact.outputs.repair }}
      legacy: ${{ steps.impact.outputs.legacy }}
      auth: ${{ steps.impact.outputs.auth }}
      app_auth: ${{ steps.impact.outputs.app_auth }}
      app_auth_owner_reuse: ${{ steps.impact.outputs.app_auth_owner_reuse }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Select affected boundaries from verified evidence baselines
        id: impact
        env:
          REVIEWED_HEAD: ${{ github.event.pull_request.head.sha }}
          APP_AUTH_EVIDENCE_BASE: 03fdbc58e5b186901c93a77e07ecddaf754e5a28
          # f042b054 passed its affected transport/controller and C22/C23 boundaries.
          # Prior C01-C21 evidence remains historical 949869f1 evidence.
          NATIVE_EVIDENCE_BASE: 932784cb5d01d40724e3e0e6d3500c9152294793
          BROWSER_EVIDENCE_BASE: 932784cb5d01d40724e3e0e6d3500c9152294793
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {appendFileSync,readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const head=process.env.REVIEWED_HEAD;
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          if(!/^[a-f0-9]{40}$/.test(head)||git('rev-parse','HEAD')!==head)throw Error('Unexpected checkout');
          function changes(base){
            if(!/^[a-f0-9]{40}$/.test(base))throw Error('Invalid evidence baseline');
            git('merge-base','--is-ancestor',base,head); // Missing/unrelated evidence fails closed.
            return git('diff','--name-only','--no-renames','-z',base,head).split('\0').filter(Boolean);
          }
