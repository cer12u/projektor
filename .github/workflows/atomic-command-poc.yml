name: Atomic command PoC

on:
  pull_request:
    paths:
      - 'experiments/atomic-command-poc/**'
      - 'browser-review-evidence/*.mjs'
      - '.github/workflows/atomic-command-poc.yml'

permissions:
  contents: read

concurrency:
  group: atomic-command-poc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sqlite-contract:
    name: SQLite atomic command contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Verify runtime and source
        run: |
          node --version
          git rev-parse HEAD
      - name: Test real SQLite with independent worker connections
        working-directory: experiments/atomic-command-poc
        run: node --test test/*.test.mjs
      - name: Verify tests leave tracked files unchanged
        run: git diff --exit-code

  workerd-contract:
    name: workerd SQLite DO atomic command contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install locked local test runtime
        working-directory: experiments/atomic-command-poc
        run: npm ci
      - name: Test actual workerd SQLite (no deployment)
        working-directory: experiments/atomic-command-poc
        run: |
          node --version
          node_modules/.bin/workerd --version
          git rev-parse HEAD
          npm run test:workerd
      - name: Verify tests leave tracked files unchanged
        run: git diff --exit-code

  authenticated-transport:
    name: Local authenticated HTTP and recovery contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install locked local test runtime
        working-directory: experiments/atomic-command-poc
        run: npm ci
      - name: Test local issuer HTTP authentication and recovery (no deployment)
        working-directory: experiments/atomic-command-poc
        run: |
          node --version
          node_modules/.bin/workerd --version
          git rev-parse HEAD
          npm run test:transport
          npm run test:client
      - name: Verify tests leave tracked files unchanged
        run: git diff --exit-code

  browser-draft-recovery:
    name: Local Chromium encrypted draft recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install locked local browser test runtime
        working-directory: experiments/atomic-command-poc
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium
      - name: Test synthetic authorization fixture
        working-directory: experiments/atomic-command-poc
        run: |
          mkdir -p evidence/browser
          set -o pipefail
          node --test --test-reporter=tap browser-test/fixture-authz.test.mjs 2>&1 | tee evidence/browser/fixture-authz.tap
      - name: Test real Chromium draft recovery (local issuer only)
        working-directory: experiments/atomic-command-poc
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee evidence/browser/browser-suite.log
      - name: Independently probe browser vault isolation
        if: ${{ !cancelled() }}
        run: |
          mkdir -p experiments/atomic-command-poc/evidence/browser
          set -o pipefail
          node browser-review-evidence/vault-probes.mjs 2>&1 | tee experiments/atomic-command-poc/evidence/browser/vault-probes.log
      - name: Independently probe browser editor recovery
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          node --test --test-reporter=tap browser-review-evidence/editor-probes.mjs 2>&1 | tee experiments/atomic-command-poc/evidence/browser/editor-probes.tap
      - name: Verify tests leave tracked files unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code
      - name: Upload synthetic browser screenshots and test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: local-browser-draft-recovery-${{ github.event.pull_request.head.sha }}
          path: experiments/atomic-command-poc/evidence/browser/
          if-no-files-found: warn
          retention-days: 7
