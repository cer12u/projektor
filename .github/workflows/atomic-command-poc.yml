c/session-ports/human-workflow.mjs":"fb2bac78c0bddcc8a5ac0f89fcfcb301199a8e025991b22d87aa1e8bff2f3eb6","experiments/atomic-command-poc/src/my-issues.mjs":"c7c718af42c2f51e8bf92486388d65661ea9624c468e844bb1f542d101920dfa","experiments/atomic-command-poc/src/issue-compat.mjs":"d5cde8f719814158dc33d131518442d20ca545d62e6873063f3a42e086c635ee","experiments/atomic-command-poc/src/agent-workflow.mjs":"ecf28c726ef37ea13b42403e6cc3ab91035b393422e17b7e52c80cf6c3f4a3ac","experiments/atomic-command-poc/src/schema.sql":"524e6303c0e02615298e46847b19d3e83463e4572a53ea00bbc6b5027b882e2b","experiments/atomic-command-poc/src/issue-content.mjs":"c8ac4df7b9dd2eb69ff5bb6f67a3deb71cbc60a22bf8f3e846b568d0624f7f6d","experiments/atomic-command-poc/src/shared-core.mjs":"fdfdf12878900d1472e938ae7b4a47236034be95fa25974f55a6a906614d141b","experiments/atomic-command-poc/src/content-page.mjs":"0e5aa62ec178cb4088751251be900fc4c506feb26a6675a693ee9e0f5e2147d1","experiments/atomic-command-poc/client/recovery.mjs":"001277dc80645d095288ab9a6348ff5a2b4150a6c429885ec4be2d22915edaa1","experiments/product-ui/vendor/client/recovery.mjs":"001277dc80645d095288ab9a6348ff5a2b4150a6c429885ec4be2d22915edaa1"};
          const focused=native.length>0&&native.every(p=>focusedPaths.has(p))&&Object.entries(reviewedIssueBytes).every(([p,hash])=>createHash('sha256').update(readFileSync(p)).digest('hex')===hash);
          const repairPaths=new Set([".github/workflows/atomic-command-poc.yml","experiments/atomic-command-poc/client/recovery.mjs","experiments/product-ui/CHECKPOINT.json","experiments/product-ui/SOURCE-SHA256SUMS","experiments/product-ui/test/issue-compatibility-boundary.test.mjs","experiments/product-ui/vendor/client/recovery.mjs"]);
          const repair=focused&&native.every(p=>repairPaths.has(p));
          const legacyPaths=new Set([".github/workflows/atomic-command-poc.yml","experiments/atomic-command-poc/release/reviewed-product.json","experiments/atomic-command-poc/scripts/legacy-url-upgrade.sql","experiments/atomic-command-poc/service-test/legacy-url-fixture.mjs","experiments/atomic-command-poc/service-test/legacy-url.integration.test.mjs","experiments/atomic-command-poc/service/http.mjs","experiments/atomic-command-poc/service/workspace.mjs","experiments/atomic-command-poc/src/issue-content.mjs","experiments/atomic-command-poc/src/legacy-url.mjs","experiments/atomic-command-poc/src/schema.sql","experiments/product-ui/CHECKPOINT.json","experiments/product-ui/SOURCE-SHA256SUMS","experiments/product-ui/e2e/github-reporter.mjs","experiments/product-ui/e2e/legacy-navigation.test.mjs","experiments/product-ui/e2e/trace.mjs","experiments/product-ui/src/App.tsx","experiments/product-ui/src/ProjectView.tsx","experiments/product-ui/src/WikiView.tsx","experiments/product-ui/src/contracts.ts","experiments/product-ui/src/legacy-navigation.ts","experiments/product-ui/src/product-ports.ts","experiments/product-ui/src/router.ts","experiments/product-ui/test/legacy-navigation.test.mjs","experiments/product-ui/test/legacy-url-boundary.test.mjs","experiments/product-ui/test/reporting.test.mjs","experiments/product-ui/test/ui-contracts.test.mjs"]);
          const reviewedLegacyBytes={"experiments/atomic-command-poc/release/reviewed-product.json":"9c352d0b1a7382cefeb51c9d827ceef8205ec24594707a06f83ea8860dd17784","experiments/atomic-command-poc/scripts/legacy-url-upgrade.sql":"e299532f2c903717bffa35263a959a88cba27e204c13aa08af475eb587751319","experiments/atomic-command-poc/service-test/legacy-url-fixture.mjs":"17d3f723be721c0a50e0d8a47b6db00fb4960c453639e25b4158cb433b22af23","experiments/atomic-command-poc/service-test/legacy-url.integration.test.mjs":"92af88544c38ff248fe311ed9433628e2e59c7515003fcc60065bb69606ee83f","experiments/atomic-command-poc/service/http.mjs":"36dd23ad1b86861d9c3c5b390fbd8006325e3619769b33cff97e1249d971ce61","experiments/atomic-command-poc/service/workspace.mjs":"94dfdf5d8fd47a9fb1fc093731a469df802ce5d38f716fd8f1dc6afb30d09d8d","experiments/atomic-command-poc/src/issue-content.mjs":"153b9014c3b971cd3d53afda74b3893abe19ee0f23698831222206ebce65220d","experiments/atomic-command-poc/src/legacy-url.mjs":"1105343c4561e0bac1f436201aed1d4a3d50187fbe1bfe5b96803c81c6a1c057","experiments/atomic-command-poc/src/schema.sql":"f4299482f0031ace721497417b4c002ae0b22636acb78a89c000c370947ce273","experiments/product-ui/CHECKPOINT.json":"b463b9267ebb4bf1ec5348963415587b78899c8be14e94049220cfff22db8d5b","experiments/product-ui/SOURCE-SHA256SUMS":"5c7fb8d6521bda1480b84f388b938090d01ec266958709eca361f3b97df0e77d","experiments/product-ui/e2e/github-reporter.mjs":"5bf92f1db780ed14157c8351e4fe4fdd895e8150a80fa5269726c56f6b64798a","experiments/product-ui/e2e/legacy-navigation.test.mjs":"02497b957d679504087e98b24c5708f0977c8257adc8c0d3a32e5730e9f44cfb","experiments/product-ui/e2e/trace.mjs":"997b9b637fd09d41eb0543597c9f6d325360129f94a01fed4a325d92253c4d8e","experiments/product-ui/src/App.tsx":"eb501500a38813a8afc0eb335355da7e352101452a0be0401366d7dd57ce305b","experiments/product-ui/src/ProjectView.tsx":"b4973dd85132d331e03219238b40dbcc68a573f5414e658ee38db9f2e1743a8d","experiments/product-ui/src/WikiView.tsx":"afc4a7d01c4e9228d19cb66059c9c0517f8d3e7d87005214a8fa12f45bb3e2c3","experiments/product-ui/src/contracts.ts":"d30fb540697e28a363dec4a1124fe9144e5cd274217c7df8637542fd3862c887","experiments/product-ui/src/legacy-navigation.ts":"2b8ca433f60bd46281b93c265e5a8fa42eca2721c3d51cbac762f9b99d981bf3","experiments/product-ui/src/product-ports.ts":"1d638f4142f7be6d06d88573bdc3acd12c2df549a16782456dc834aaaf2a3ea2","experiments/product-ui/src/router.ts":"530684097e14a972e0036a37d2cc6a30a9fdcd3e890d637585bc03fc6fbc655e","experiments/product-ui/test/legacy-navigation.test.mjs":"6c751f33bcca83d1701e00df32242d1b591cb254cedfec9a11536aa4f0dfa07d","experiments/product-ui/test/legacy-url-boundary.test.mjs":"e34298ca9c0a94848c96ad84ccb53ba928922e1b1c71ba3fbe078f31a47c46f9","experiments/product-ui/test/reporting.test.mjs":"764cedbcb52fd422cccff3f90270f69e8e5a6175ce2237e9df1f7f5e5d57e164","experiments/product-ui/test/ui-contracts.test.mjs":"026fd08346c8e00c11fbd17ecaf4053f709faedb2fff287e096f1c6076ee181e"};
