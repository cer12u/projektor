name: CI

on:
  # Test all PR bases, including stacked PRs and drafts.
  pull_request:
  # Allow other workflows (e.g. release.yml) to run these exact checks as a gate.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'   # pinned; apps/docs' astro 7 requires Node >= 22.12
          cache: 'pnpm'
      - name: Install locked dependencies
        id: dependencies
        run: pnpm install --frozen-lockfile
      # Run every check after a successful install, even if an earlier check fails.
      # Failed steps still fail the job; no continue-on-error or suppressed failures.
      - name: Docs publishing safety tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node --test apps/docs/scripts/submit-indexnow.test.mjs
      - name: Generated docs are fresh
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          pnpm gen:docs
          git diff --exit-code -- apps/docs/src/content/docs/agents/tool-catalog.md \
            apps/docs/src/content/docs/agents/workflow-spec.md \
            apps/docs/src/generated/mcp-stats.json README.md \
            apps/docs/src/content/docs/contributing/conventions.md \
            apps/docs/src/content/docs/guides/feedback-widget-integration.md \
            || { echo "::error::Generated docs are stale. Run 'pnpm gen:docs' and commit the result."; exit 1; }
          # A directory, not a fixed file list (PLAYBOOKS can gain/lose entries), so
          # `git status --porcelain` (which also reports untracked new files) is the
          # right check here, not `git diff` (which misses untracked additions).
          [ -z "$(git status --porcelain -- apps/docs/src/content/docs/agents/playbooks/)" ] \
            || { echo "::error::Generated playbook docs are stale. Run 'pnpm gen:docs' and commit the result."; exit 1; }
      - id: lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm lint --reporter=github --max-diagnostics=50
      - name: Bounded public source formatting preview 1
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.lint.outcome == 'failure' }}
        env:
          FORMAT_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/lint-with-format-diagnostics.mjs --preview-only --notice-window=0
      - name: Bounded public source formatting preview 2
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.lint.outcome == 'failure' }}
        env:
          FORMAT_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/lint-with-format-diagnostics.mjs --preview-only --notice-window=1
      - name: Bounded public source formatting preview 3
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.lint.outcome == 'failure' }}
        env:
          FORMAT_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/lint-with-format-diagnostics.mjs --preview-only --notice-window=2
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/ci/source-diagnostics.mjs pnpm turbo type-check --log-prefix=none
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm --filter @projektor/db test
      # Coverage subsumes the plain test run (same tests, plus threshold enforcement -
      # see apps/api and apps/web vitest configs for the ratchet levels, PROJ-223).
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm --filter @projektor/api test:coverage
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm --filter @projektor/web test:coverage
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm --filter @projektor/web build
      - name: Bundle size budget (PROJ-841)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        # A true inline PR comment needs a token with `pull-requests: write`, which this
        # job intentionally doesn't request — the per-chunk delta table instead goes to
        # the job's own step summary (no extra permissions needed).
        # No label/env override here on purpose: this step also runs on `workflow_call`
        # from release.yml, where there is no PR to carry a label, so a label-driven
        # override would leave main permanently over budget the moment a labelled PR
        # merged. The only way to accept a deliberate size increase is `--update` plus
        # committing the new bundle-budget.json, which shows up in the PR diff for review.
        run: pnpm bundle-budget
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm --filter @projektor/docs build
      # PTORDEV-6: Node 22.12's SQLite lacks FTS5 (confirmed in CI), while this
      # additional SQL suite deliberately applies every migration, including FTS.
      # Keep all existing gates above on Node 22.12. Do not skip FTS migrations.
      - name: Set up SQLite integrity runtime
        id: project_sql_runtime
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Project key SQL integrity
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.project_sql_runtime.outcome == 'success' }}
        run: pnpm --filter @projektor/db test:project-integrity
# E2E tests: run manually with 'pnpm --filter @projektor/web test:e2e'
# Long-running freeze regression tests (PROJ-310): 'pnpm --filter @projektor/web test:e2e:long'
# Requires: E2E_BASE_URL pointing at a dev deployment with ENVIRONMENT=development and DEV_USER_EMAIL set.
