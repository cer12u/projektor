name: CI

on:
  # Test all PR bases, including stacked PRs and drafts.
  pull_request:
    # Experimental service/UI have their own affected-boundary integration gates.
    paths-ignore:
      - 'experiments/atomic-command-poc/**'
      - 'experiments/product-ui/**'
      - 'browser-review-evidence/**'
      - 'query-review-evidence/**'
      - 'service-review-evidence/**'
      - '.github/workflows/atomic-command-poc.yml'
  # Allow other workflows (e.g. release.yml) to run these exact checks as a gate.
  workflow_call:
  # Allow explicit verification of the canonical app at any ref.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  system:
    name: Canonical system (Node 24.19.0)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/system
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/system/package-lock.json
      - name: Install the independently pinned npm version
        run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - name: Verify measured toolchain
        run: node --version && test "$(npm --version)" = '11.9.0'
      - name: Install locked runtime and build tools
        run: npm ci --include=dev --include=optional
      - name: Verify active source, boundaries and built API
        run: npm run verify:ci
      - name: Verify execution fencing and MCP recovery
        env:
          PTORDEV32_SELECT: '^live report lease fencing survives renewal, prepared recovery and batch races$'
        run: |
          node tests/client/agent/ptordev33-client-check.mjs
          npm run test:mcp-transport
      - name: Check generated public API freshness
        run: npm run docs:generate && git diff --exit-code -- docs/openapi.json
      - name: Check root release selects only this app
        working-directory: .
        run: node --test scripts/system-integration.test.mjs scripts/github-deployment-host.test.mjs
