workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
stages: [verify, test, build, smoke, deploy]
default:
  # Prebuilt by tools/ci-image.sh: pinned Node + pnpm + a store prefetched from the
  # lockfile, so jobs skip the pnpm download and most package fetching.
  image: harbor.vp25.home/tkdev/projektor-ci:node-c1b09b814e97@sha256:cf89e3fdf49a21f50324ef5157e10a97de89b58ee18f838121418f1872a9f00b
  before_script:
    - node --version
    - python3 --version
    - pnpm install --frozen-lockfile --prefer-offline
variables:
  npm_config_store_dir: /pnpm-store
boundaries:
  stage: verify
  script:
    - pnpm check:boundaries
    - mkdir -p reports
    - node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=reports/boundaries.xml tools/boundaries.test.mjs
  artifacts:
    when: always
    reports:
      junit: reports/boundaries.xml
    paths: [reports/]
    expire_in: 7 days
static:
  stage: verify
  script:
    - pnpm lint
    - pnpm typecheck
    - pnpm check:contracts
modules:
  stage: test
  script:
    - pnpm test:modules --coverage
    - pnpm test:migrations
    - pnpm test:gateway
  artifacts:
    when: always
    reports:
      junit: reports/platform.xml
    paths: [reports/]
    expire_in: 7 days
# Browser fixture is local Miniflare with a test-only assertion injector; no CI credentials.
browser:
  stage: test
  image: harbor.vp25.home/tkdev/projektor-ci:browser-c1b09b814e97@sha256:9e9616a4e76346bc1dac64fc2b24db4cd731521afeda38005f34312e5ea3dbda
  script: ["pnpm test:web"]
  artifacts:
    when: on_failure
    paths: [test-results/]
    expire_in: 7 days
build:
  stage: build
  script:
    - pnpm build
  artifacts:
    paths: [dist/]
    expire_in: 7 days
integration:
  stage: build
  needs: [build]
  script: ["pnpm check:artifact", "pnpm test:smoke"]
cloudflare-smoke:
  stage: smoke
  needs:
    - job: build
      artifacts: true
    - job: integration
  resource_group: cloudflare-verify
  # The runner reports script failures as exit 1, so exit_codes: [78] cannot mark
  # missing credentials as a warning. Select by variable presence instead.
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $CLOUDFLARE_API_TOKEN && $CLOUDFLARE_ACCOUNT_ID'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      allow_failure: true
  script: ["pnpm smoke:cloudflare"]
deploy:
  stage: deploy
  resource_group: production
  rules:
    - when: never
  script: ["pnpm deploy:artifact"]
