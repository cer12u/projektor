workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
stages: [verify, test, build, smoke, deploy]
# Environment-specific values (registries, resource names, zones) come from CI/CD
# variables, never from this file. Without the image variables the jobs fall back to
# public images and install pnpm on the fly. See docs/operations.md.
variables:
  CI_NODE_IMAGE: node:22.22.1-bookworm@sha256:f90672bf4c76dfc077d17be4c115b1ae7731d2e8558b457d86bca42aeb193866
  CI_BROWSER_IMAGE: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
default:
  image: $CI_NODE_IMAGE
  before_script:
    - node --version
    - python3 --version
    - command -v pnpm >/dev/null || npm install --global pnpm@10.18.0 --ignore-scripts
    - pnpm install --frozen-lockfile --prefer-offline
boundaries:
  stage: verify
  script:
    - pnpm check:boundaries
    - mkdir -p reports
    - node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=reports/boundaries.xml tools/boundaries.test.mjs
  artifacts:
    when: always
    reports:
      junit: reports/boundaries.xml
    paths: [reports/]
    expire_in: 7 days
static:
  stage: verify
  script:
    - pnpm lint
    - pnpm typecheck
    - pnpm check:contracts
    - pnpm check:literals
modules:
  stage: test
  script:
    - pnpm test:modules --coverage
    - pnpm test:migrations
    - pnpm test:gateway
  artifacts:
    when: always
    reports:
      junit: reports/platform.xml
    paths: [reports/]
    expire_in: 7 days
# Browser fixture is local Miniflare with a test-only assertion injector; no CI credentials.
browser:
  stage: test
  image: $CI_BROWSER_IMAGE
  script: ["pnpm test:web"]
  artifacts:
    when: on_failure
    paths: [test-results/]
    expire_in: 7 days
build:
  stage: build
  script:
    - pnpm build
  artifacts:
    paths: [dist/]
    expire_in: 7 days
integration:
  stage: build
  needs: [build]
  script: ["pnpm check:artifact", "pnpm test:smoke"]
cloudflare-smoke:
  stage: smoke
  needs:
    - job: build
      artifacts: true
    - job: integration
  resource_group: cloudflare-verify
  # The runner reports script failures as exit 1, so exit_codes: [78] cannot mark
  # missing credentials as a warning. Select by variable presence instead.
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $CLOUDFLARE_API_TOKEN && $CLOUDFLARE_ACCOUNT_ID'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      allow_failure: true
  script: ["pnpm smoke:cloudflare"]
# Read-only listing of Workers, domains, D1/KV/R2 and Access for cut-over planning.
cloudflare-inventory:
  stage: smoke
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $CLOUDFLARE_API_TOKEN && $CLOUDFLARE_ACCOUNT_ID'
      when: manual
      allow_failure: true
  before_script: []
  script: ["node tools/cloudflare-inventory.mjs"]
deploy:
  stage: deploy
  resource_group: production
  rules:
    - when: never
  script: ["pnpm deploy:artifact"]
